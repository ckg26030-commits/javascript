<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        for (let j = 1; j <= 5; j = j + 1) {
            for (let k = 1; k <= 5; k++) {
                document.write(j * k);
                document.write("　");
            }
            document.write("<br>");
        }
    </script>
    <hr>
    <script>
        var i = 1;
        while (i<=5 ) {
            document.write(i);
            document.write("<br>");
            i = i + 1;
        }
    </script>
    <hr>
    <script>
        var i=10;
        do{
            document.write(i);
            document.write("<br");
            i=i+1;
        }while(i<=5);
    </script>
    <hr>
    <script>
        for(var i=1; i<=5; i++){
            var k = 1;
            for(var j= 1; j<=5; j++){
               document.write(i*j); 
               document.write("　");
            }
            document.write("k=" +k);   
        }
        document.write("★k=" + k);
        
    </script>
</body>

</html>
